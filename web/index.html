<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050706" />
    <meta
      name="description"
      content="ARI OS Control — operator console for a self-hosted, non-custodial Solana trading agent. The model proposes. The kernel disposes."
    />
    <title>ARI OS Control</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Typefaces are self-hosted from /fonts (see web/src/styles/fonts.css). The
      console must not fetch from a third party: it runs on operator hardware,
      often without egress, behind default-src 'self'. Do not reintroduce a CDN.
      Same-origin preload for the two faces that paint first — the body face and
      the italic of the ARI mark. crossorigin is required even same-origin, or the
      font is fetched twice.
    -->
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/instrument-serif-400-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
