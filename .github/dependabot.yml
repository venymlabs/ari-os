version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint caps its peer range at `typescript <6.1.0`, so a
      # TypeScript major bump breaks `npm ci` with ERESOLVE before any test
      # runs. Re-evaluate when typescript-eslint ships TypeScript 7 support.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
